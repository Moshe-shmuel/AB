name: Build & Single-File Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - '*'
  pull_request:
    branches:
      - main
      - master
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-single-file:
    name: Compile & Bundle Single-File App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Type-Check (TypeScript Lint)
        run: npm run lint

      - name: Build & Bundle into Single File
        run: npm run build:single

      - name: Upload Single-File Artifact on Every Commit
        uses: actions/upload-artifact@v4
        with:
          name: Budget-Maaser-Pro-SingleFile-${{ github.sha }}
          path: |
            release/Budget-Maaser-Pro-SingleFile.html
            release/Budget-Maaser-Pro-Desktop.hta
          if-no-files-found: error
          retention-days: 90

      - name: Attach Single-File Build to GitHub Release (on Tag or Release)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Budget-Maaser-Pro-SingleFile.html
            release/Budget-Maaser-Pro-Desktop.hta
          generate_release_notes: true
          body: |
            ### כלכלת הבית ומעשרות Pro — מהדורת קובץ בודד (Single-File Release)
            - **`Budget-Maaser-Pro-SingleFile.html`**: קובץ יחיד עצמאי (Single-File) הכולל את כל האפליקציה, העיצוב והלוגיקה בקובץ אחד לפתיחה מיידית בכל מחשב וללא צורך באינטרנט.
            - **`Budget-Maaser-Pro-Desktop.hta`**: קובץ תוכנה שולחנית עצמאית ל-Windows בקובץ בודד.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
