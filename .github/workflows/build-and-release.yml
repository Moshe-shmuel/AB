name: Build Electron Portable EXE & Single-File Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - '*'
  pull_request:
    branches:
      - main
      - master
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-electron-exe:
    name: Build Standalone Electron .EXE & Single-File HTML
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Electron & Electron-Builder
        run: npm install --no-save --legacy-peer-deps electron@34.2.0 electron-builder@25.1.8

      - name: Type-Check (TypeScript Lint)
        run: npm run lint

      - name: Build App, Single-File HTML & Standalone Electron Portable .EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:exe

      - name: Verify Portable .EXE & HTML Output
        shell: pwsh
        run: |
          if (!(Test-Path "release/Budget-Maaser-Pro-Portable.exe")) {
            Write-Error "Budget-Maaser-Pro-Portable.exe was not generated!"
            exit 1
          }
          if (!(Test-Path "release/Budget-Maaser-Pro-SingleFile.html")) {
            Write-Error "Budget-Maaser-Pro-SingleFile.html was not generated!"
            exit 1
          }
          Get-ChildItem release/

      - name: Upload Electron Portable .EXE & Single-File Artifact on Every Commit
        uses: actions/upload-artifact@v4
        with:
          name: Budget-Maaser-Pro-Desktop-${{ github.sha }}
          path: |
            release/Budget-Maaser-Pro-Portable.exe
            release/Budget-Maaser-Pro-SingleFile.html
          if-no-files-found: error
          retention-days: 90

      - name: Attach Electron Portable .EXE & Single-File Build to GitHub Release (on Tag or Release)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Budget-Maaser-Pro-Portable.exe
            release/Budget-Maaser-Pro-SingleFile.html
          generate_release_notes: true
          body: |
            ### כלכלת הבית ומעשרות Pro — תוכנה שולחנית עצמאית ל-Windows (Electron Portable .EXE)
            - **`Budget-Maaser-Pro-Portable.exe`**: תוכנה שולחנית עצמאית מלאה ל-Windows (קובץ `.EXE` יחיד מבוסס Electron, ללא תלות ב-Chrome או בדפדפן חיצוני וללא צורך בהתקנה).
            - **`Budget-Maaser-Pro-SingleFile.html`**: קובץ HTML יחיד עצמאי (Single-File) לפתיחה מהירה בכל מחשב.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
