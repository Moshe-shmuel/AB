name: Build Windows EXE & Single-File Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - '*'
  pull_request:
    branches:
      - main
      - master
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Compile Windows .EXE & Single-File App
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Type-Check (TypeScript Lint)
        run: npm run lint

      - name: Build App & Compile Windows .EXE (Budget-Maaser-Pro.exe)
        run: npm run build:single

      - name: Verify EXE & HTML Output Exists
        shell: pwsh
        run: |
          if (!(Test-Path "release/Budget-Maaser-Pro.exe")) {
            Write-Error "Budget-Maaser-Pro.exe was not generated!"
            exit 1
          }
          if (!(Test-Path "release/Budget-Maaser-Pro-SingleFile.html")) {
            Write-Error "Budget-Maaser-Pro-SingleFile.html was not generated!"
            exit 1
          }
          Get-ChildItem release/

      - name: Upload Windows .EXE & Single-File Artifact on Every Commit
        uses: actions/upload-artifact@v4
        with:
          name: Budget-Maaser-Pro-Windows-EXE-${{ github.sha }}
          path: |
            release/Budget-Maaser-Pro.exe
            release/Budget-Maaser-Pro-SingleFile.html
          if-no-files-found: error
          retention-days: 90

      - name: Attach Windows .EXE & Single-File Build to GitHub Release (on Tag or Release)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Budget-Maaser-Pro.exe
            release/Budget-Maaser-Pro-SingleFile.html
          generate_release_notes: true
          body: |
            ### כלכלת הבית ומעשרות Pro — מהדורת תוכנה שולחנית ל-Windows (.EXE) וקובץ בודד
            - **`Budget-Maaser-Pro.exe`**: קובץ הרצה שולחני אמיתי ל-Windows (קובץ `.EXE` עצמאי יחיד ללא צורך בהתקנה) הכולל בתוכו את המערכת המלאה ושומר נתונים מקומית במחשב.
            - **`Budget-Maaser-Pro-SingleFile.html`**: קובץ HTML יחיד עצמאי (Single-File) לפתיחה ישירה בכל דפדפן.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
